{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Control Interface{% endblock %}</title>

    <!-- Bootstrap CSS (локальный файл) -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- Собственные стили при необходимости -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Подключаем шапку с кнопкой меню -->
    {% include 'includes/header.html' %}

    <!-- Центральная рабочая зона -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подключаем подвал -->
    {% include 'includes/footer.html' %}

    <!-- Bootstrap Bundle JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <!-- Логика переключения кнопки и поиска -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
